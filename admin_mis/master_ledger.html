<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Ledger - APMC Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        :root { --primary: #004493; --surface: #f8f9fa; --on-surface: #191c1d; --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-600: #475569; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Work Sans', sans-serif; }
        body { background-color: var(--surface); color: var(--on-surface); display: flex; }
        
        /* Sidebar (Same as others) */
        .sidebar { width: 260px; height: 100vh; background: white; border-right: 1px solid var(--slate-200); position: fixed; display: flex; flex-direction: column; }
        .sidebar-header { padding: 1.5rem; border-bottom: 1px solid var(--slate-200); }
        .sidebar-nav { padding: 1rem 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .nav-link { padding: 0.75rem 1rem; border-radius: 0.5rem; color: var(--slate-600); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 0.75rem; }
        .nav-link.active { background: var(--primary); color: white; }
        
        .main-content { margin-left: 260px; padding: 2rem; width: 100%; }
        .headline { font-family: 'Public Sans', sans-serif; color: var(--primary); margin-bottom: 1rem; font-weight: 900; text-transform: uppercase; font-size: 1.8rem;}
        
        .search-bar { width: 100%; max-width: 400px; padding: 1rem; border: 1px solid var(--slate-200); border-radius: 0.5rem; font-size: 1rem; margin-bottom: 1.5rem; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 0.5rem; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th { background: var(--primary); color: white; padding: 1rem; text-align: left; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
        td { padding: 1rem; border-bottom: 1px solid var(--slate-200); font-size: 0.95rem; }
        tr:hover { background-color: var(--slate-50); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 style="color: var(--primary); font-family: 'Public Sans', sans-serif; font-weight: 900;">APMC Admin</h2>
            <p style="font-size: 0.8rem; color: var(--slate-600);">Accounts & MIS</p>
        </div>
        <nav class="sidebar-nav">
            <a href="license_master.html" class="nav-link"><span class="material-symbols-outlined">badge</span> Trader License</a>
            <a href="estate_management.html" class="nav-link"><span class="material-symbols-outlined">storefront</span> Shop Rent</a>
            <a href="master_ledger.html" class="nav-link active"><span class="material-symbols-outlined">menu_book</span> Master Ledger</a>
            <a href="bhav_patrak.html" class="nav-link"><span class="material-symbols-outlined">trending_up</span> Bhav Patrak</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1 class="headline">Master Ledger (नोंदवही)</h1>
        <p style="margin-bottom: 1.5rem; color: var(--slate-600);">Digital record of all cleared transactions and Payouts.</p>
        
        <input type="text" class="search-bar" id="search" placeholder="Search by Trader, Adatya, or Lot ID..." onkeyup="filterLedger()">
        
        <table id="ledgerTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Lot ID</th>
                    <th>Adatya (Shop)</th>
                    <th>Trader (Buyer)</th>
                    <th>Commodity</th>
                    <th>Net Wt (Qtl)</th>
                    <th>Total Payout (₹)</th>
                </tr>
            </thead>
            <tbody id="ledgerBody">
                </tbody>
        </table>
    </main>

    <script>
        function loadLedger() {
            // clearedTransactions is generated by hishobpatti.html
            const history = JSON.parse(localStorage.getItem('clearedTransactions') || '{}');
            const tbody = document.getElementById('ledgerBody');
            
            if(Object.keys(history).length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding: 2rem; color: grey;">No cleared transactions found. Complete a Hishobpatti first.</td></tr>`;
                return;
            }

            tbody.innerHTML = Object.values(history).map(tx => `
                <tr>
                    <td>${tx.date}</td>
                    <td style="font-family: monospace; font-weight: bold;">${tx.lotId}</td>
                    <td style="color: var(--primary); font-weight: 600;">${tx.agent}</td>
                    <td>${tx.trader}</td>
                    <td>${tx.commodity}</td>
                    <td>${(parseFloat(tx.weightKg)/100).toFixed(2)}</td>
                    <td style="font-weight: bold;">₹${parseInt(tx.netPayable).toLocaleString('en-IN')}</td>
                </tr>
            `).join('');
        }
        
        function filterLedger() {
            let filter = document.getElementById('search').value.toUpperCase();
            let rows = document.getElementById('ledgerTable').getElementsByTagName('tr');
            for (let i = 1; i < rows.length; i++) {
                rows[i].style.display = rows[i].innerText.toUpperCase().includes(filter) ? "" : "none";
            }
        }
        
        window.onload = loadLedger;
    </script>
</body>
</html>
