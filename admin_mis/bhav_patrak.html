<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Rate Report (Bhav Patrak) - APMC</title>
    <style>
        /* Print-First CSS Design */
        body { font-family: serif; background: #f8f9fa; padding: 2rem; color: #000; margin: 0; }
        .document-container { background: white; max-width: 800px; margin: 0 auto; padding: 3rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        .header-box { text-align: center; margin-bottom: 2rem; border-bottom: 2px solid #000; padding-bottom: 1rem;}
        h2 { font-size: 1.8rem; margin: 0 0 0.5rem 0; font-weight: 900; }
        h3 { font-size: 1.2rem; margin: 0 0 1rem 0; }
        .date-line { font-size: 1.1rem; font-weight: bold; text-align: right; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; border: 2px solid #000; }
        th, td { border: 1px solid #000; padding: 0.75rem; text-align: center; font-size: 1.1rem; }
        th { background: #f1f5f9; font-weight: bold; }
        td:first-child { text-align: left; padding-left: 1rem; font-weight: bold; }
        
        .footer-box { margin-top: 4rem; display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; }
        
        .print-btn { display: block; margin: 0 auto 2rem; background: #004493; color: white; border: none; padding: 1rem 2rem; font-size: 1.2rem; cursor: pointer; border-radius: 0.5rem; font-family: sans-serif; font-weight: bold;}
        
        @media print {
            body { background: white; padding: 0; }
            .document-container { box-shadow: none; padding: 0; max-width: 100%; }
            .print-btn { display: none; }
        }
    </style>
</head>
<body>
    <button class="print-btn" onclick="window.print()">🖨️ Print Bhav Patrak</button>

    <div class="document-container">
        <div class="header-box">
            <h2>उच्चतम कृषी उत्पन्न बाजार समिती माजलगाव, जि. बीड</h2>
            <h3>-:- दैनिक बाजार भाव पत्रक -:-</h3>
            <div class="date-line">दिनांक: <span id="todayDate"></span></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>शेतीमाल (Commodity)</th>
                    <th>आवक (Quintals)</th>
                    <th>भाव कमाल (Max)</th>
                    <th>भाव किमान (Min)</th>
                    <th>सरासरी (Avg)</th>
                </tr>
            </thead>
            <tbody id="bhavBody">
                </tbody>
            <tfoot>
                <tr>
                    <td style="text-align: right;">एकूण आवक:</td>
                    <td id="totalAavak" style="font-weight: 900; font-size: 1.2rem;">0</td>
                    <td colspan="3"></td>
                </tr>
            </tfoot>
        </table>

        <div class="footer-box">
            <div></div>
            <div style="text-align: center;">
                सचिव<br>
                कृषी उत्पन्न बाजार समिती<br>
                माजलगाव जि. बीड
            </div>
        </div>
    </div>

    <script>
        document.getElementById('todayDate').innerText = new Date().toLocaleDateString('en-IN');
        
        function generateReport() {
            // Looks into all the active/completed auctions from the day
            const lots = JSON.parse(localStorage.getItem('auctionLots') || '{}');
            const summary = {};
            let totalYardAavak = 0;

            Object.values(lots).forEach(lot => {
                if (!lot.ratePerQuintal) return; // Only count completed Saudass
                const name = lot.commodity;
                const rate = parseFloat(lot.ratePerQuintal);
                const qtl = parseFloat(lot.weightKg) / 100;

                if (!summary[name]) {
                    summary[name] = { aavak: 0, min: rate, max: rate, sum: 0, count: 0 };
                }
                
                summary[name].aavak += qtl;
                totalYardAavak += qtl;
                summary[name].min = Math.min(summary[name].min, rate);
                summary[name].max = Math.max(summary[name].max, rate);
                summary[name].sum += rate;
                summary[name].count++;
            });

            const tbody = document.getElementById('bhavBody');
            
            if (Object.keys(summary).length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="color: grey; text-align: center;">No completed auctions (Saudas) found for today.</td></tr>`;
                return;
            }

            tbody.innerHTML = Object.keys(summary).map(name => `
                <tr>
                    <td>${name}</td>
                    <td style="font-weight: bold;">${summary[name].aavak.toFixed(2)}</td>
                    <td>₹${summary[name].max}</td>
                    <td>₹${summary[name].min}</td>
                    <td style="font-weight: bold;">₹${Math.round(summary[name].sum / summary[name].count)}</td>
                </tr>
            `).join('');

            document.getElementById('totalAavak').innerText = totalYardAavak.toFixed(2);
        }
        
        window.onload = generateReport;
    </script>
</body>
</html>
