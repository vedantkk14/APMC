<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Base Rates - APMC</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&family=Work+Sans:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* UI CSS Variables matched to your APMC theme */
        :root {
            --background: #f8f9fa; --surface: #f8f9fa; --on-primary: #ffffff; --primary: #004493; --primary-fixed: #d8e2ff;
            --on-surface: #191c1d; --surface-container: #edeeef; --slate-50: #f8fafc; --slate-100: #f1f5f9;
            --slate-200: #e2e8f0; --slate-400: #94a3b8; --slate-600: #475569; --green-600: #16a34a; --green-700: #15803d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--surface); font-family: 'Work Sans', sans-serif; color: var(--on-surface); padding-bottom: 4rem; }
        @media (min-width: 768px) { body { padding-bottom: 0; } }
        .headline { font-family: 'Public Sans', sans-serif; }

        /* App Layout & Nav */
        .top-nav { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 1.5rem; height: 4rem; position: sticky; top: 0; z-index: 50; background-color: #ffffff; border-bottom: 1px solid var(--slate-200); }
        .nav-brand { font-size: 1.25rem; font-weight: 900; color: var(--primary); }
        .app-wrapper { display: flex; min-height: calc(100vh - 4rem); }
        
        .sidebar { display: none; flex-direction: column; width: 256px; border-right: 1px solid var(--slate-200); background-color: var(--slate-50); flex-shrink: 0; position: fixed; height: calc(100vh - 4rem); left: 0; top: 4rem; z-index: 40; }
        @media (min-width: 768px) { .sidebar { display: flex; } }
        .sidebar-header { padding: 1.5rem; }
        .sidebar-title { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
        .sidebar-nav { flex: 1; padding: 0 0.5rem; display: flex; flex-direction: column; gap: 0.25rem; }
        .sidebar-link { padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.75rem; border-radius: 0.375rem; font-weight: 600; font-size: 0.875rem; }
        .sidebar-link.active { background-color: var(--primary); color: #ffffff; }

        /* Main Content */
        .main-content { flex: 1; padding: 1rem; width: 100%; }
        @media (min-width: 768px) { .main-content { margin-left: 256px; padding: 2.5rem; } }
        .max-w-container { max-width: 1000px; margin: 0 auto; }
        
        .page-header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
        .page-title { font-size: 1.875rem; font-weight: 900; color: var(--primary); }
        
        .btn-save { background-color: var(--green-600); color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 700; border: none; cursor: pointer; transition: background-color 0.2s; font-size: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn-save:hover { background-color: var(--green-700); }

        /* Table Card */
        .form-card { background-color: #ffffff; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); overflow: hidden; border-top: 6px solid var(--primary); }
        .card-header { padding: 1.5rem; border-bottom: 1px solid var(--slate-200); background-color: var(--slate-50); text-align: center; }
        .card-title { font-size: 1.5rem; font-weight: 800; color: #000; }
        
        .table-responsive { width: 100%; overflow-x: auto; }
        .rates-table { width: 100%; border-collapse: collapse; text-align: center; }
        .rates-table th { background-color: var(--slate-100); padding: 1rem 0.5rem; font-weight: 800; border-bottom: 2px solid var(--slate-200); border-right: 1px solid var(--slate-200); font-size: 0.95rem; color: var(--slate-600); }
        .rates-table th:last-child { border-right: none; }
        .rates-table td { padding: 0.5rem; border-bottom: 1px solid var(--slate-200); border-right: 1px solid var(--slate-200); vertical-align: middle; }
        .rates-table td:last-child { border-right: none; }
        .rates-table tr:hover { background-color: var(--slate-50); }
        
        .sr-no { font-weight: 600; color: var(--slate-600); width: 60px; }
        .commodity-name { font-weight: 700; font-size: 1.1rem; text-align: left; padding-left: 1rem !important; }
        
        .form-input { width: 100%; padding: 0.5rem; border: 1px solid var(--slate-200); border-radius: 0.25rem; text-align: center; font-weight: 600; font-family: inherit; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-fixed); }
        
        /* Highlight the Minimum Base Rate Column visually */
        .col-min-rate { background-color: #f0fdf4; }
        .rates-table th.col-min-rate { background-color: #dcfce3; color: var(--green-700); border-bottom-color: var(--green-600); }
        .input-min-rate { border-color: var(--green-600); color: var(--green-700); background-color: #fff; }

        .date-picker-container { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1rem; }
        .date-input { padding: 0.5rem 1rem; border: 1px solid var(--slate-200); border-radius: 0.375rem; font-weight: 600; outline: none; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-brand">APMC Market</div>
    </nav>

    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">Admin Panel</h1>
            </div>
            <nav class="sidebar-nav">
                <a class="sidebar-link active" href="#"><span>दैनिक भाव पत्रक (Base Rates)</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="max-w-container">
                <header class="page-header">
                    <h1 class="page-title headline">Market Base Rates Entry</h1>
                    <button class="btn-save" onclick="saveBaseRates()">💾 Save Daily Rates</button>
                </header>

                <div class="form-card">
                    <div class="card-header">
                        <h2 class="card-title">दैनिक भाव पत्रक</h2>
                        <div class="date-picker-container">
                            <label for="report-date" style="font-weight: 600; color: var(--slate-600);">Date (दिनांक):</label>
                            <input type="date" id="report-date" class="date-input" />
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="rates-table" id="ratesTable">
                            <thead>
                                <tr>
                                    <th>अ. क्र.</th>
                                    <th style="text-align: left; padding-left: 1rem;">तपशील<br><small>(Commodity)</small></th>
                                    <th>आवक<br><small>(Inward Qty)</small></th>
                                    <th>भाव कमाल<br><small>(Max Rate ₹)</small></th>
                                    <th class="col-min-rate">भाव किमान (Base Rate)<br><small>(Min Rate ₹)</small></th>
                                    <th>सरासरी<br><small>(Avg Rate ₹)</small></th>
                                </tr>
                            </thead>
                            <tbody id="ratesBody">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // List of commodities exactly matching the physical form
        const commodities = [
            "साळ (Paddy/Rice)",
            "गहू (Wheat)",
            "ज्वारी (Jowar)",
            "बाजरी (Bajra)",
            "हरभरा (Gram/Chickpea)",
            "तूर (Tur/Pigeon Pea)",
            "मूग (Moong)",
            "उडीद (Urad)",
            "शेंग (Groundnut)",
            "एरंडी (Castor)",
            "करडई (Safflower)",
            "जवस (Linseed)",
            "सूर्यफूल (Sunflower)",
            "अंबाडी (Ambadi)",
            "कापूस (Cotton)",
            "सोयाबीन (Soybean)",
            "तीळ (Sesame)",
            "राळे (Foxtail Millet)",
            "मका (Maize)"
        ];

        // Initialize Table
        function renderTable() {
            const tbody = document.getElementById('ratesBody');
            tbody.innerHTML = '';
            
            // Set today's date default
            document.getElementById('report-date').valueAsDate = new Date();

            // Check if there's existing data for today
            const existingData = JSON.parse(localStorage.getItem('apmcBaseRates') || '{}');

            commodities.forEach((item, index) => {
                const engKey = item.split('(')[1].replace(')','').trim(); // Extract english name as data key
                const savedRow = existingData[engKey] || { inward: '', max: '', min: '', avg: '' };

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="sr-no">${index + 1}</td>
                    <td class="commodity-name" data-key="${engKey}">${item.split(' (')[0]}</td>
                    <td><input type="number" class="form-input" data-col="inward" placeholder="0" value="${savedRow.inward}"></td>
                    <td><input type="number" class="form-input" data-col="max" placeholder="0.00" value="${savedRow.max}"></td>
                    <td class="col-min-rate"><input type="number" class="form-input input-min-rate" data-col="min" placeholder="Base ₹" value="${savedRow.min}"></td>
                    <td><input type="number" class="form-input" data-col="avg" placeholder="0.00" value="${savedRow.avg}"></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Save data to LocalStorage
        function saveBaseRates() {
            const date = document.getElementById('report-date').value;
            const rows = document.querySelectorAll('#ratesBody tr');
            const ratesData = {};

            rows.forEach(row => {
                const key = row.querySelector('.commodity-name').getAttribute('data-key');
                const inward = row.querySelector('input[data-col="inward"]').value;
                const max = row.querySelector('input[data-col="max"]').value;
                const min = row.querySelector('input[data-col="min"]').value;
                const avg = row.querySelector('input[data-col="avg"]').value;

                // Only save if at least the Base Rate (Min) is provided
                if(min || max || inward || avg) {
                    ratesData[key] = {
                        inward: inward ? parseFloat(inward) : 0,
                        max: max ? parseFloat(max) : 0,
                        min: min ? parseFloat(min) : 0,  // This is the critical Base Rate
                        avg: avg ? parseFloat(avg) : 0
                    };
                }
            });

            // Save to localStorage so auction modules can fetch it
            localStorage.setItem('apmcBaseRates', JSON.stringify(ratesData));
            localStorage.setItem('apmcBaseRatesDate', date);
            
            alert(`✅ Base Rates for ${date} successfully saved!\nAuction bidding will now respect these minimums.`);
        }

        // Auto-calculate Average (Optional QoL improvement for authorities)
        document.getElementById('ratesTable').addEventListener('input', function(e) {
            if(e.target.classList.contains('form-input')) {
                const row = e.target.closest('tr');
                const maxInput = row.querySelector('input[data-col="max"]');
                const minInput = row.querySelector('input[data-col="min"]');
                const avgInput = row.querySelector('input[data-col="avg"]');

                if (maxInput.value && minInput.value) {
                    const max = parseFloat(maxInput.value);
                    const min = parseFloat(minInput.value);
                    // Only auto-fill if avg is currently empty or if the user is changing min/max
                    if(max > 0 && min > 0) {
                        const calculatedAvg = ((max + min) / 2).toFixed(2);
                        avgInput.value = calculatedAvg;
                    }
                }
            }
        });

        // Run on load
        window.onload = renderTable;
    </script>
</body>
</html>
